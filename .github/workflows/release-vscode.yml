name: Release VS Code Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v0.2.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./apps/vscode/package.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match apps/vscode package version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build:vscode

      - name: Check extension manifest
        working-directory: apps/vscode
        run: npm run check:manifest

      - name: Package VSIX
        working-directory: apps/vscode
        run: npm run package:vsix

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Skill Bridge VS Code Extension ${{ steps.meta.outputs.tag }}
          body: |
            VS Code extension package for Skill Bridge.

            - Adds Workspace/Central folder open actions.
            - Includes tree title buttons, context menu entries, and quick action entries.
          files: apps/vscode/skill-bridge-vscode-${{ steps.meta.outputs.version }}.vsix
