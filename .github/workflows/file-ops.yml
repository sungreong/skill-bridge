name: File Operations

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  file-ops:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - "20"
          - "24"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Workflow coverage guard
        run: npm run check:file-ops-workflow

      - name: Performance tools guard
        run: npm run check:performance-tools

      - name: Performance status guard
        run: npm run check:performance-status

      - name: Refresh timing parser guard
        run: npm run check:refresh-timings

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Package VSIX
        run: npm --workspace apps/vscode run package:vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: skill-bridge-vscode-${{ matrix.os }}-node${{ matrix.node }}
          path: apps/vscode/skill-bridge-vscode-*.vsix
          if-no-files-found: error
          retention-days: 14

      - name: File operation smoke test
        run: npm run test:file-ops:dist -- --write ".benchmarks/smoke-file-ops-${{ matrix.os }}-node${{ matrix.node }}.json"

      - name: File operation symlink escape smoke test
        if: runner.os != 'Windows'
        run: npm run test:file-ops:dist -- --require-symlink-check --write ".benchmarks/smoke-file-ops-symlink-${{ matrix.os }}-node${{ matrix.node }}.json"

      - name: Upload smoke test result
        uses: actions/upload-artifact@v4
        with:
          name: smoke-file-ops-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            .benchmarks/smoke-file-ops-${{ matrix.os }}-node${{ matrix.node }}.json
            .benchmarks/smoke-file-ops-symlink-${{ matrix.os }}-node${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 14

      - name: File operation benchmark
        run: npm run benchmark:file-ops:dist -- --preset smoke --include-control --fail-on-min-speedup core.copyDirectory=1.1,vscode.collectFiles=1.1,core.collectFiles=1.1,vscode.applyTransferQueueCore=1.2,vscode.transferPlanCore=1.2 --os "${{ matrix.os }}" --node-major "${{ matrix.node }}" --write ".benchmarks/file-ops-${{ matrix.os }}-node${{ matrix.node }}.json"

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: file-ops-${{ matrix.os }}-node${{ matrix.node }}
          path: .benchmarks/file-ops-${{ matrix.os }}-node${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 14

      - name: File operation loading benchmark
        run: npm run benchmark:file-ops:dist -- --preset loading --include-control --fail-on-min-speedup core.copyDirectory=1.1,vscode.collectFiles=1.1,core.collectFiles=1.1,vscode.applyTransferQueueCore=1.2,vscode.transferPlanCore=1.2 --os "${{ matrix.os }}" --node-major "${{ matrix.node }}" --write ".benchmarks/loading-file-ops-${{ matrix.os }}-node${{ matrix.node }}.json"

      - name: Upload loading benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: loading-file-ops-${{ matrix.os }}-node${{ matrix.node }}
          path: .benchmarks/loading-file-ops-${{ matrix.os }}-node${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 14

      - name: File operation transfer benchmark
        run: npm run benchmark:file-ops:dist -- --preset transfer --rounds 3 --include-control --fail-on-min-speedup core.copyDirectory=1.1,vscode.collectFiles=1.1,core.collectFiles=1.1,vscode.applyTransferQueueCore=1.2,vscode.transferPlanCore=1.2 --os "${{ matrix.os }}" --node-major "${{ matrix.node }}" --write ".benchmarks/transfer-file-ops-${{ matrix.os }}-node${{ matrix.node }}.json"

      - name: Upload transfer benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: transfer-file-ops-${{ matrix.os }}-node${{ matrix.node }}
          path: .benchmarks/transfer-file-ops-${{ matrix.os }}-node${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 14

  compare-file-ops:
    name: Compare file operation artifacts
    runs-on: ubuntu-latest
    needs: file-ops

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Artifact comparer self-check
        run: npm run check:file-ops-comparers

      - name: Download benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: file-ops-*
          path: .benchmarks/artifacts

      - name: Download loading benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: loading-file-ops-*
          path: .benchmarks/loading-artifacts

      - name: Download transfer benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: transfer-file-ops-*
          path: .benchmarks/transfer-artifacts

      - name: Download smoke test artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: smoke-file-ops-*
          path: .benchmarks/smoke-artifacts

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: skill-bridge-vscode-*
          path: .benchmarks/vsix-artifacts

      - name: Compare benchmark artifacts
        run: npm run compare:file-ops-artifacts -- --dir .benchmarks/artifacts --summary .benchmarks/file-ops-artifacts.md --require-matrix --require-preset smoke

      - name: Compare loading benchmark artifacts
        run: npm run compare:loading-file-ops-artifacts -- --dir .benchmarks/loading-artifacts --summary .benchmarks/loading-file-ops-artifacts.md --require-matrix --require-preset loading

      - name: Compare transfer benchmark artifacts
        run: npm run compare:transfer-file-ops-artifacts -- --dir .benchmarks/transfer-artifacts --summary .benchmarks/transfer-file-ops-artifacts.md --require-matrix --require-preset transfer

      - name: Compare smoke test artifacts
        run: npm run compare:smoke-file-ops-artifacts -- --dir .benchmarks/smoke-artifacts --summary .benchmarks/smoke-file-ops-artifacts.md --require-matrix

      - name: Compare VSIX artifacts
        run: npm run compare:vsix-artifacts -- --dir .benchmarks/vsix-artifacts --summary .benchmarks/vsix-artifacts.md --require-matrix

      - name: Generate performance status report
        run: npm run report:performance-status -- --summary .benchmarks/performance-status.md --transfer-artifact-summary .benchmarks/transfer-file-ops-artifacts.md

      - name: Append comparison to job summary
        run: cat .benchmarks/file-ops-artifacts.md .benchmarks/loading-file-ops-artifacts.md .benchmarks/transfer-file-ops-artifacts.md .benchmarks/smoke-file-ops-artifacts.md .benchmarks/vsix-artifacts.md .benchmarks/performance-status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison summary
        uses: actions/upload-artifact@v4
        with:
          name: file-ops-comparison
          path: |
            .benchmarks/file-ops-artifacts.md
            .benchmarks/loading-file-ops-artifacts.md
            .benchmarks/transfer-file-ops-artifacts.md
            .benchmarks/smoke-file-ops-artifacts.md
            .benchmarks/vsix-artifacts.md
            .benchmarks/performance-status.md
          if-no-files-found: error
          retention-days: 14
